services:
  minitel-ha:
    image: python:3.12-slim
    container_name: minitel-ha
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3615:3615"
      - "8080:8080"
    command: >
      sh -c "pip install aiohttp websockets pyyaml --quiet &&
             python server.py"
    restart: unless-stopped
