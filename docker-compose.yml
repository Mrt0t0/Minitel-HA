services:
  minitel-ha:
    build: .
    container_name: minitel-ha
    ports:
      - "3615:3615"   # Minitel (ESP32 / TelnetPro / Minimit)
      - "8080:8080"   # emulateur navigateur
    volumes:
      - ./config.yaml:/app/config.yaml          # cree avant : cp config.example.yaml config.yaml
      - ./static/archives:/app/static/archives  # pages .vdt
      - ./data:/app/data                        # journal des actions
    restart: unless-stopped
