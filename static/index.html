<!DOCTYPE html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3615 MAISON — Minitel-HA</title>
<link rel="icon" href="data:,">
<style>
:root{--case:#2e2e2e;--case2:#242424;--key:#3c3c3c;--keyfn:#14203c;--envoi:#5a1818;--txt:#ccc}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#111}
body{display:flex;justify-content:center;padding:6px;font-family:"Courier New",monospace;min-height:100dvh}
#boitier{background:linear-gradient(160deg,#3a3a3a,var(--case2));border:3px solid #555;border-radius:12px 12px 6px 6px;padding:8px;width:min(98vw,980px);height:calc(100dvh - 12px);display:flex;flex-direction:column;gap:6px;box-shadow:0 8px 32px #000}
#hdr{display:flex;align-items:center;gap:8px;color:#bbb;font-size:12px;font-weight:bold;letter-spacing:1px}
#hdr .t{flex:1}
#st{color:#7a9;font-size:11px}
#st.err{color:#e77}
#zone{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#050505;border:3px inset #1a1a1a;border-radius:6px;overflow:hidden;cursor:text}
#vt{display:block;image-rendering:pixelated;background:#000}
#kbd{position:absolute;left:-9999px;top:0;width:1px;height:1px;opacity:0}
#cl{display:flex;flex-direction:column;gap:3px;flex-shrink:0}
.kr{display:flex;gap:3px;justify-content:center;flex-wrap:wrap}
.k{background:linear-gradient(180deg,#4a4a4a,var(--key));color:var(--txt);border:1px solid #555;border-bottom:3px solid #181818;border-radius:4px;cursor:pointer;font-family:inherit;font-size:11px;min-width:30px;height:30px;padding:0 6px;user-select:none;white-space:nowrap;font-weight:bold}
.k:active{border-bottom-width:1px;transform:translateY(2px)}
.kf{background:linear-gradient(180deg,#1c2a50,var(--keyfn));color:#9bf;border-color:#284070;flex:1;min-width:58px;font-size:10px}
.ke{background:linear-gradient(180deg,#7a2020,var(--envoi));color:#fbb;border-color:#7a2828;min-width:70px}
.kn{color:#fe6;font-size:14px}
.km{background:linear-gradient(180deg,#1c3a1c,#102010);color:#8f8;border-color:#285828;flex:1;min-width:44px;font-size:10px}
.kt{color:#adf}
#up{display:none}
</style>
</head>
<body>
<div id="boitier">
  <div id="hdr"><span class="t">3615 MAISON — MINITEL-HA v__VERSION__</span><span id="st">…</span></div>
  <div id="zone"><canvas id="vt"></canvas></div>
  <input id="kbd" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="clavier">
  <input id="up" type="file" accept=".vdt">
  <div id="cl">
    <div class="kr">
      <button class="k kf" data-fn="SOMMAIRE">SOMMAIRE</button>
      <button class="k kf" data-fn="GUIDE">GUIDE</button>
      <button class="k kf" data-fn="ANNULATION">ANNULATION</button>
      <button class="k kf" data-fn="CORRECTION">CORRECTION</button>
      <button class="k kf" data-fn="RETOUR">‹ RETOUR</button>
      <button class="k kf" data-fn="SUITE">SUITE ›</button>
      <button class="k kf" data-fn="REPETITION">REPETITION</button>
    </div>
    <div class="kr">
      <button class="k kn" data-ch="1">1</button><button class="k kn" data-ch="2">2</button>
      <button class="k kn" data-ch="3">3</button><button class="k kn" data-ch="4">4</button>
      <button class="k kn" data-ch="5">5</button><button class="k kn" data-ch="6">6</button>
      <button class="k kn" data-ch="7">7</button><button class="k kn" data-ch="8">8</button>
      <button class="k kn" data-ch="9">9</button><button class="k kn" data-ch="0">0</button>
      <button class="k" data-ch="*">*</button><button class="k" data-ch="#">#</button>
      <button class="k ke" data-fn="ENVOI">ENVOI</button>
    </div>
    <div class="kr">
      <button class="k km" data-ch="d">D</button><button class="k km" data-ch="c">C</button>
      <button class="k km" data-ch="m">M</button><button class="k km" data-ch="s">S</button>
      <button class="k km" data-ch="j">J</button><button class="k km" data-ch="a">A</button>
      <button class="k km" data-ch="r">R</button><button class="k km" data-ch="h">H</button>
      <button class="k kt" id="bkbd" title="">⌨</button>
      <button class="k kt" id="bup" title="">.vdt ⇪</button>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';
var LANG='__LANG__';
var L={fr:{conn:'Connexion…',ok:'Connecté',lost:'Déconnecté — reconnexion…',kbd:'Clavier (saisie de texte)',
          up:'Déposer une page .vdt',upok:'Page déposée : ',uperr:'Échec du dépôt : ',auth:'code d\'accès requis'},
       en:{conn:'Connecting…',ok:'Connected',lost:'Disconnected — reconnecting…',kbd:'Keyboard (text input)',
          up:'Upload a .vdt page',upok:'Page uploaded: ',uperr:'Upload failed: ',auth:'access code required'}}[LANG]||{};

/* ------------------------------------------------------------------
   Emulateur Videotex : flux continu, 40 x 24 + ligne de service 0
   ------------------------------------------------------------------ */
var FN={ENVOI:0x41,RETOUR:0x42,REPETITION:0x43,GUIDE:0x44,ANNULATION:0x45,SOMMAIRE:0x46,CORRECTION:0x47,SUITE:0x48};
// G2 (SS2 = 0x19) : accent + lettre, ou caractere seul
var ACC={0x41:{a:'à',e:'è',u:'ù'},0x42:{e:'é'},0x43:{a:'â',e:'ê',i:'î',o:'ô',u:'û'},0x48:{a:'ä',e:'ë',i:'ï',o:'ö',u:'ü'},0x4b:{c:'ç'}};
var G2S={0x23:'£',0x30:'°',0x31:'±',0x6a:'Œ',0x7a:'œ',0x7b:'ß',0x2c:'←',0x2d:'↑',0x2e:'→',0x2f:'↓',0x3c:'¼',0x3d:'½',0x3e:'¾'};
var G0={0x5e:'↑',0x60:'─',0x7e:'‾',0x7f:' '};
var ENC={};Object.keys(ACC).forEach(function(k){var m=ACC[k];Object.keys(m).forEach(function(l){ENC[m[l]]=[0x19,+k,l.charCodeAt(0)];});});
Object.keys(G2S).forEach(function(k){ENC[G2S[k]]=[0x19,+k];});

var VT={
  COLS:40,ROWS:25,CW:12,CH:18,
  PAL:['#000000','#ff3030','#20d020','#ffff40','#3060ff','#ff40ff','#40ffff','#ffffff'],
  blinkOn:true,
  cell:function(){return{ch:' ',fg:7,bg:0,blink:false,conceal:false,invert:false,graphics:false,bits:0,sep:false,lr:false,w:1,h:1,skip:false};},
  row:function(){var r=[];for(var c=0;c<this.COLS;c++)r.push(this.cell());return r;},
  reset:function(){this.screen=[];for(var r=0;r<this.ROWS;r++)this.screen.push(this.row());this.st=this.attrs({row:1,col:0,cursor:false,saved:null});this.ss2=null;this.pending=[];},
  attrs:function(s){s.fg=7;s.bg=0;s.graphics=false;s.blink=false;s.conceal=false;s.invert=false;s.sep=false;s.w=1;s.h=1;s.last=null;return s;},
  esc:function(n){var s=this.st;
    if(n>=0x40&&n<=0x47){s.fg=n-0x40;return;} if(n>=0x50&&n<=0x57){s.bg=n-0x50;return;}
    if(n===0x48){s.blink=true;return;} if(n===0x49){s.blink=false;return;}
    if(n===0x4c){s.w=1;s.h=1;return;} if(n===0x4d){s.w=1;s.h=2;return;}
    if(n===0x4e){s.w=2;s.h=1;return;} if(n===0x4f){s.w=2;s.h=2;return;}
    if(n===0x58){s.conceal=true;return;} if(n===0x5f){s.conceal=false;return;}
    if(n===0x59){s.sep=false;return;} if(n===0x5a){s.sep=true;return;}
    if(n===0x5c){s.invert=false;return;} if(n===0x5d){s.invert=true;return;}
  },
  clearRows:function(a,b){for(var r=a;r<=b;r++)this.screen[r]=this.row();},
  goto:function(r,c){var s=this.st;r=Math.max(0,Math.min(24,r));
    if(r===0&&s.row!==0)s.saved=[s.row,s.col];
    s.row=r;s.col=Math.max(0,Math.min(39,c-1));this.attrs(s);},
  put:function(cell){var s=this.st;if(s.row>24)return;
    var w=s.w,h=s.h;if(s.row===0){w=1;h=1;} if(s.col+w>this.COLS)w=1; if(s.row-h+1<1)h=1;
    cell.w=w;cell.h=h;var top=s.row-(h-1);
    this.screen[top][s.col]=cell;
    for(var dy=0;dy<h;dy++)for(var dx=0;dx<w;dx++)if(dx||dy){var rr=top+dy,cc=s.col+dx;if(cc<this.COLS)this.screen[rr][cc]={skip:true,bg:cell.bg};}
    s.last=cell;s.col+=w;
    if(s.col>=this.COLS){s.col=0;if(s.row>0)s.row=s.row<24?s.row+1:1;}
  },
  glyph:function(ch){var s=this.st;return{ch:ch,fg:s.fg,bg:s.bg,blink:s.blink,conceal:s.conceal,invert:s.invert,graphics:false,bits:0,sep:false,lr:false,skip:false};},
  feed:function(bytes){
    var buf=this.pending.length?this.pending.concat(Array.from(bytes)):bytes,s=this.st;this.pending=[];
    for(var i=0;i<buf.length;i++){
      var b=buf[i]&0x7f;
      if(this.ss2!==null){ // accent G2 en attente de sa lettre
        if(this.ss2==='?'){ if(ACC[b]){this.ss2=b;continue;} this.ss2=null; if(G2S[b])this.put(this.glyph(G2S[b])); continue; }
        var m=ACC[this.ss2]||{},ch=String.fromCharCode(b);this.ss2=null;this.put(this.glyph(m[ch]||ch));continue;
      }
      if((b===0x1b||b===0x12)&&i+1>=buf.length){this.pending=[b];break;}
      if(b===0x1f&&i+2>=buf.length){this.pending=Array.from(buf.slice(i));break;}
      switch(b){
        case 0x0c:this.clearRows(1,24);s.row=1;s.col=0;this.attrs(s);continue;
        case 0x1e:s.row=1;s.col=0;this.attrs(s);continue;
        case 0x08:s.col=Math.max(0,s.col-1);continue;
        case 0x09:s.col=Math.min(39,s.col+1);continue;
        case 0x0a:if(s.row===0&&s.saved){s.row=s.saved[0];s.col=s.saved[1];s.saved=null;this.attrs(s);}else s.row=Math.min(24,s.row+1);continue;
        case 0x0b:s.row=Math.max(1,s.row-1);continue;
        case 0x0d:s.col=0;continue;
        case 0x0e:s.graphics=true;continue;
        case 0x0f:s.graphics=false;continue;
        case 0x11:s.cursor=true;continue;
        case 0x14:s.cursor=false;continue;
        case 0x18:for(var c=s.col;c<this.COLS;c++){var e=this.cell();e.bg=s.bg;this.screen[s.row][c]=e;}continue;
        case 0x19:this.ss2='?';continue;
        case 0x12:var n=(buf[++i]&0x7f)-0x40;for(var k=0;k<n&&s.last;k++){var cp=JSON.parse(JSON.stringify(s.last));this.put(cp);}continue;
        case 0x1b:this.esc(buf[++i]&0x7f);continue;
        case 0x1f:this.goto((buf[i+1]&0x7f)-0x40,(buf[i+2]&0x7f)-0x40);i+=2;continue;
      }
      if(b<0x20)continue;
      if(s.graphics&&!(b>=0x40&&b<=0x5f)){
        var lr=b>=0x60,v=lr?b-0x60:b-0x20;
        this.put({ch:' ',fg:s.fg,bg:s.bg,blink:s.blink,conceal:s.conceal,invert:s.invert,graphics:true,bits:v&31,lr:lr,sep:s.sep,skip:false});
      }else this.put(this.glyph(G0[b]||String.fromCharCode(b)));
    }
  },
  draw:function(cv){
    var W=this.COLS*this.CW,H=this.ROWS*this.CH,dpr=Math.max(1,window.devicePixelRatio||1);
    if(cv.width!==Math.round(W*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);}
    var x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.imageSmoothingEnabled=false;
    x.font='bold 15px "Courier New",Courier,monospace';x.textBaseline='top';
    x.fillStyle='#000';x.fillRect(0,0,W,H);var anim=false;
    for(var r=0;r<this.ROWS;r++)for(var c=0;c<this.COLS;c++){
      var e=this.screen[r][c],px=c*this.CW,top=r*this.CH;
      if(e.skip)continue; // case couverte par un caractere double (peint par celui-ci)
      var w=this.CW*(e.w||1),h=this.CH*(e.h||1),fg=e.invert?e.bg:e.fg,bg=e.invert?e.fg:e.bg;
      x.fillStyle=this.PAL[bg&7];x.fillRect(px,top,w,h);
      if(e.blink)anim=true;
      if(e.conceal||(e.blink&&!this.blinkOn))continue;
      x.fillStyle=this.PAL[fg&7];
      if(e.graphics){var hw=w>>1,h1=Math.floor(h/3),h3=h-2*h1,p=e.sep?1:0;
        if(e.bits&1)x.fillRect(px+p,top+p,hw-p,h1-p); if(e.bits&2)x.fillRect(px+hw+p,top+p,w-hw-p,h1-p);
        if(e.bits&4)x.fillRect(px+p,top+h1+p,hw-p,h1-p); if(e.bits&8)x.fillRect(px+hw+p,top+h1+p,w-hw-p,h1-p);
        if(e.bits&16)x.fillRect(px+p,top+2*h1+p,hw-p,h3-p); if(e.lr)x.fillRect(px+hw+p,top+2*h1+p,w-hw-p,h3-p);
      }else if(e.ch!==' '){x.save();x.translate(px+1,top+2);x.scale(e.w||1,e.h||1);x.fillText(e.ch,0,0);x.restore();}
    }
    var s=this.st;
    if(s.cursor){anim=true;if(this.blinkOn&&s.row<=24){x.fillStyle=this.PAL[7];x.fillRect(s.col*this.CW,s.row*this.CH+this.CH-3,this.CW,2);}}
    this.animated=anim;
  }
};
VT.reset();

var cv=document.getElementById('vt'),zone=document.getElementById('zone'),st=document.getElementById('st'),
    kbd=document.getElementById('kbd'),up=document.getElementById('up');
document.getElementById('bkbd').title=L.kbd;document.getElementById('bup').title=L.up;
var dirty=true;
function fit(){var W=VT.COLS*VT.CW,H=VT.ROWS*VT.CH,s=Math.min(zone.clientWidth/W,zone.clientHeight/H);
  cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';}
function frame(){if(dirty){VT.draw(cv);dirty=false;}requestAnimationFrame(frame);}
// Le clignotement ne redessine que si l'ecran contient du texte clignotant ou le curseur
setInterval(function(){VT.blinkOn=!VT.blinkOn;if(VT.animated)dirty=true;},500);
window.addEventListener('resize',fit);fit();requestAnimationFrame(frame);

/* ------------------------------------------------------------------
   Connexion
   ------------------------------------------------------------------ */
var base=location.pathname.replace(/[^/]*$/,''),ws=null,token=null;
function status(t,err){st.textContent=t;st.className=err?'err':'';}
function connect(){
  status(L.conn);
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+base+'ws');
  ws.binaryType='arraybuffer';
  ws.onopen=function(){status(L.ok);VT.reset();dirty=true;};
  ws.onmessage=function(e){
    if(typeof e.data==='string'){try{var d=JSON.parse(e.data);if(d.token)token=d.token;}catch(x){}return;}
    VT.feed(new Uint8Array(e.data));dirty=true;
  };
  ws.onclose=function(){status(L.lost,true);setTimeout(connect,3000);};
}
function sendBytes(a){if(ws&&ws.readyState===1)ws.send(new Uint8Array(a));}
function sendFn(name){sendBytes([0x13,FN[name]]);}
function sendText(t){var out=[];for(var i=0;i<t.length;i++){var ch=t[i],c=ch.charCodeAt(0);
  if(ENC[ch])out.push.apply(out,ENC[ch]);else if(c>=0x20&&c<0x7f)out.push(c);}
  if(out.length)sendBytes(out);}

/* ------------------------------------------------------------------
   Clavier : touches de fonction + saisie via un champ invisible
   (clavier physique et clavier virtuel des mobiles)
   ------------------------------------------------------------------ */
var KEYS={Enter:'ENVOI',Backspace:'CORRECTION',Escape:'SOMMAIRE',Delete:'ANNULATION',
          ArrowRight:'SUITE',PageDown:'SUITE',ArrowLeft:'RETOUR',PageUp:'RETOUR',F1:'GUIDE',F2:'REPETITION'};
kbd.addEventListener('keydown',function(e){var f=KEYS[e.key];if(f&&!e.ctrlKey&&!e.altKey&&!e.metaKey){e.preventDefault();sendFn(f);}});
kbd.addEventListener('input',function(){if(kbd.value){sendText(kbd.value);kbd.value='';}});
function focusKbd(){kbd.focus({preventScroll:true});}
zone.addEventListener('click',focusKbd);document.getElementById('bkbd').addEventListener('click',focusKbd);
document.querySelectorAll('[data-fn]').forEach(function(b){b.addEventListener('click',function(){sendFn(b.dataset.fn);focusKbd();});});
document.querySelectorAll('[data-ch]').forEach(function(b){b.addEventListener('click',function(){sendText(b.dataset.ch);focusKbd();});});
document.addEventListener('keydown',function(e){if(document.activeElement!==kbd&&e.target.tagName!=='INPUT'){focusKbd();}});

/* ------------------------------------------------------------------
   Depot d'une page .vdt
   ------------------------------------------------------------------ */
document.getElementById('bup').addEventListener('click',function(){up.click();});
up.addEventListener('change',function(){
  var f=up.files[0];if(!f)return;var fd=new FormData();fd.append('file',f,f.name);
  fetch(base+'api/archives/upload',{method:'POST',body:fd,headers:token?{'X-Minitel-Token':token}:{}})
    .then(function(r){return r.text().then(function(t){if(!r.ok)throw new Error(r.status===401?L.auth:t);return JSON.parse(t);});})
    .then(function(d){status(L.upok+d.name+'.vdt');sendFn('REPETITION');})
    .catch(function(err){status(L.uperr+err.message,true);})
    .then(function(){up.value='';focusKbd();});
});

connect();focusKbd();
}());
</script>
</body>
</html>
