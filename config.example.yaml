# Minitel-HA - exemple de configuration
# Copier ce fichier en config.yaml puis le completer :
#   cp config.example.yaml config.yaml
# config.yaml contient votre token : il est ignore par git, ne le publiez pas.

homeassistant:
  url: http://homeassistant.local:8123
  token: "VOTRE_TOKEN_ICI"     # Profil HA -> Securite -> Jetons d'acces longue duree

server:
  vt_port: 3615                # WebSocket Minitel (ESP32 / TelnetPro / Minimit)
  http_port: 8080              # Interface navigateur

display:
  title: "   MINITEL-HA  DOMOTIQUE       "   # 38 caracteres max
  page_size: 9                 # appareils par page (1-9)
  refresh_auto: 30             # secondes entre 2 auto-refresh
  date_format: "%H:%M"         # ou "%d/%m %H:%M"
  show_sensors: true
  splash_seconds: 7            # duree du splash screen (0 = desactive)
  language: fr                 # fr | en : langue des ecrans (et de l'assistant)

security:
  access_code: ""              # ex. "1234" : code demande sur le Minitel et le navigateur

area_order:                    # ordre d'affichage des pieces
  - Salon
  - Chambre
  - Cuisine
  - Autres

scenes:
  - name: "Cinema"
    entity: scene.cinema
  - name: "Bonne nuit"
    entity: scene.bonne_nuit

scripts:
  - name: "Alarme OFF"
    entity: script.alarme_off

quick_off:                     # touche * en mode Domotique
  entity: scene.tout_eteindre
  name: "Tout eteindre"
  confirm: true                # demande ENVOI pour confirmer

alerts:                        # affichees sur la ligne 0 du Minitel
  - entity: binary_sensor.porte_entree
    state: "on"                # un etat ou une liste d'etats
    message: "Porte d'entree ouverte"
  - entity: sensor.salon_temperature
    above: 28                  # ou below: pour un seuil bas
    message: "Salon trop chaud"

meteo:
  weather_entity: weather.forecast_maison
  sensors:
    temperature_ext: sensor.exterieur_temperature
    humidity_ext: sensor.exterieur_humidite
    rooms:
      Salon:
        temp: sensor.salon_temperature
        hum: sensor.salon_humidite

assistant:
  language: fr
  agents:
    - id: conversation.home_assistant
      name: "Assistant HA"

archives:
  folder: static/archives      # pages Videotex .vdt
  auto_rotate: 30              # secondes (0 = pas de rotation)
  max_upload_kb: 512           # taille max d'une page deposee depuis le navigateur

journal:
  file: data/journal.json      # conserve entre deux redemarrages
  size: 50                     # nombre d'actions gardees

discovery:                     # utilise par discover.py
  # autres types possibles : cover, climate, lock, media_player, fan
  domains: [light, switch]
  sensor_classes: [temperature, humidity]
  exclude_keywords: [_energy, _power, _current, _voltage, _rssi, _wifi]
  exclude_entities: []

# Remplis par discover.py (ou a la main)
devices:
  - entity: light.salon
    name: Lampe salon
    area: Salon
    icon: light
    visible: true
  - entity: cover.volet_salon  # SUITE / RETOUR reglent la position
    name: Volet salon
    area: Salon

sensors:
  - entity: sensor.salon_temperature
    name: Temperature salon
    area: Salon
    unit: "°C"
    class: temperature
    visible: true
